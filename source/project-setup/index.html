<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Setup — SitRep</title>
    <script>(function(){var t=localStorage.getItem("sitrep_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})()</script>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="setup-shell">
      <!-- ── Top nav ───────────────────────────────────── -->
      <header class="setup-topbar">
        <div class="topbar-brand">
          <div class="logo-mark">S</div>
          <span class="logo-name">SitRep</span>
        </div>
        <span class="topbar-tagline">Stay aligned. Ship better.</span>
      </header>

      <!-- ── Centered card ─────────────────────────────── -->
      <main class="setup-main">
        <div class="setup-card">
          <div class="setup-card-header">
            <h1 class="setup-title">Set up your project</h1>
            <p class="setup-subtitle">Configure your workspace and invite your team.</p>
          </div>

          <div class="form-error-banner" id="error-banner" role="alert" aria-live="polite"></div>

          <form id="setup-form" novalidate>
            <!-- Project name -->
            <div class="field">
              <label for="project-name">Project name</label>
              <input
                type="text"
                id="project-name"
                name="project-name"
                placeholder="e.g. Team Alpha Sprint Board"
                required
              />
              <p class="field-error" id="name-error">Project name is required.</p>
            </div>

            <!-- Workflow selector — card style -->
            <div class="field">
              <label class="field-label-block">Workflow</label>
              <div class="workflow-cards" role="group" aria-label="Select workflow">
                <input type="radio" name="workflow" id="wf-scrum" value="scrum" checked />
                <label for="wf-scrum" class="workflow-card">
                  <span class="wf-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 20 20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect x="2" y="3" width="16" height="15" rx="2" />
                      <path d="M6 1v4M14 1v4M2 8h16" />
                      <polyline points="6.5 13 8.5 15 13.5 11" />
                    </svg>
                  </span>
                  <span class="wf-name">Scrum</span>
                  <span class="wf-desc">Sprint-based agile planning</span>
                </label>

                <input type="radio" name="workflow" id="wf-kanban" value="kanban" />
                <label for="wf-kanban" class="workflow-card">
                  <span class="wf-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 20 20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect x="2" y="2" width="4" height="14" rx="1" />
                      <rect x="8" y="2" width="4" height="10" rx="1" />
                      <rect x="14" y="2" width="4" height="12" rx="1" />
                    </svg>
                  </span>
                  <span class="wf-name">Kanban</span>
                  <span class="wf-desc">Visualize your workflow</span>
                </label>

                <input type="radio" name="workflow" id="wf-xp" value="xp" />
                <label for="wf-xp" class="workflow-card">
                  <span class="wf-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 20 20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <circle cx="10" cy="10" r="7" />
                      <polyline points="6.5 10.5 8.5 12.5 13.5 8.5" />
                    </svg>
                  </span>
                  <span class="wf-name">XP</span>
                  <span class="wf-desc">Engineering excellence through practices</span>
                </label>
              </div>
            </div>

            <!-- Team members -->
            <div class="field">
              <label for="member-email">Invite team members</label>
              <div class="member-add-row">
                <input
                  type="email"
                  id="member-email"
                  name="member-email"
                  placeholder="teammate@example.com"
                  autocomplete="off"
                />
                <button type="button" class="btn-add-member" id="add-member-btn">Add</button>
              </div>
              <p class="field-error" id="member-error">Please enter a valid email address.</p>
            </div>

            <!-- Member list -->
            <div class="member-list-wrap" id="member-list-wrap" hidden>
              <p class="member-list-label">Team members</p>
              <ul class="member-list" id="member-list" aria-label="Team members"></ul>
            </div>

            <!-- Submit -->
            <div class="setup-actions">
              <button type="submit" class="btn btn-primary" id="submit-btn">
                Create workspace
                <span class="btn-arrow" aria-hidden="true">→</span>
              </button>
            </div>
          </form>

          <p class="setup-footer-note">
            <svg
              class="note-icon"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <circle cx="8" cy="8" r="6" />
              <path d="M8 7v4M8 5.5v.5" />
            </svg>
            You can add more members later from your workspace settings.
          </p>
        </div>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
