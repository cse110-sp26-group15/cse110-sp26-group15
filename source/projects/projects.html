<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Projects · SitRep</title>
    <!-- Apply the saved theme before paint so dark-mode users don't see a
         light flash (mirrors the dashboard pages). -->
    <script>
      (function () {
        var t = localStorage.getItem("sitrep_theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
    <!-- theme.css first so its design tokens cascade into components.css and
         the page-specific stylesheets below. main.css supplies the shared
         logo + user-menu component styling so those two fixtures match the
         dashboards; projects.css drops the sidebar, pins them to the page
         corners, and layers on the project-list specifics. -->
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/components.css" />
    <link rel="stylesheet" href="../dashboard/main.css" />
    <link rel="stylesheet" href="./projects.css" />
  </head>
  <body>
    <!-- ── SitRep logo (top-left) ───────────────────────
         No sidebar on this page, so the logo is pinned to the top-left corner
         instead. It points back here, matching the dashboards' sidebar logo. -->
    <a href="./projects.html" class="sidebar-logo projects-logo">
      <div class="logo-mark">S</div>
      <div class="logo-text">SitRep</div>
    </a>

    <main class="content-area" id="page-content">
      <header class="projects-page__header">
        <h1>Your projects</h1>
        <p class="projects-page__subtitle">Pick a project to open its dashboard.</p>
      </header>

      <!-- projects.js fills this list with one card per project the user
           belongs to; each card links through to that project's dashboard
           and (for projects the user created) offers a delete control. -->
      <ul id="project-list" class="project-list"></ul>
      <p id="empty" hidden>You're not in any projects yet — create your first one below.</p>
      <p id="error" class="error" hidden></p>

      <section class="project-create">
        <h2>New project</h2>
        <form id="create-form">
          <input
            id="new-name"
            class="input"
            type="text"
            placeholder="Project name"
            autocomplete="off"
            required
          />
          <select id="new-workflow" class="input input--select" aria-label="Workflow">
            <option value="scrum">Scrum</option>
            <option value="kanban">Kanban</option>
            <option value="xp">XP</option>
          </select>

          <div class="member-invite">
            <input
              id="member-email"
              class="input"
              type="email"
              placeholder="Teammate email"
              autocomplete="off"
              aria-label="Teammate email"
            />
            <button id="add-member-btn" class="btn btn--secondary" type="button">Add</button>
          </div>
          <p id="member-error" class="error" hidden></p>
          <ul id="member-list" class="member-list"></ul>

          <button id="create-btn" class="btn btn--primary" type="submit">Create</button>
        </form>
        <p id="create-error" class="error" hidden></p>
        <p id="create-note" class="create-note" hidden></p>
      </section>
    </main>

    <!-- ── User info + account menu (bottom-left) ────────
         Same markup/IDs the sidebar footer used so initUserMenu() (called in
         projects.js) wires the avatar/name/email plus the Profile, Settings,
         and Log Out actions. projects.css pins it to the bottom-left corner. -->
    <div class="user-menu projects-user-menu" id="user-menu">
      <div class="user-dropdown" id="user-dropdown" hidden>
        <a href="../profile/index.html" class="dropdown-item">
          <svg
            class="dropdown-icon"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="8" cy="5.5" r="2.5" />
            <path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" />
          </svg>
          Profile
        </a>
        <a href="../settings/index.html" class="dropdown-item">
          <svg
            class="dropdown-icon"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="8" cy="8" r="2" />
            <path
              d="M8 2v1M8 13v1M2 8h1M13 8h1M3.5 3.5l.7.7M11.8 11.8l.7.7M12.5 3.5l-.7.7M4.2 11.8l-.7.7"
            />
          </svg>
          Settings
        </a>
        <div class="dropdown-divider"></div>
        <button type="button" class="dropdown-item dropdown-item--danger" id="logout-btn">
          <svg
            class="dropdown-icon"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M10 11l3-3-3-3M13 8H6M6 3H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3" />
          </svg>
          Log Out
        </button>
      </div>
      <button
        type="button"
        class="user-menu-trigger"
        id="user-menu-trigger"
        aria-haspopup="true"
        aria-expanded="false"
        aria-label="Account menu"
      >
        <div class="avatar" id="user-avatar">U</div>
        <div class="user-info">
          <p class="user-name" id="user-name">User</p>
          <p class="user-role" id="user-email"></p>
        </div>
        <svg
          class="user-menu-chevron"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="4 6 8 10 12 6" />
        </svg>
      </button>
    </div>

    <script type="module" src="./projects.js"></script>
  </body>
</html>
