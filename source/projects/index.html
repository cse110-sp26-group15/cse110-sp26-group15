<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Projects · SitRep</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/components.css" />
  </head>
  <body>
    <main class="projects-page">
      <h1>Your projects</h1>
      <ul id="project-list" class="project-list"></ul>
      <p id="empty" hidden>You're not in any projects yet — create your first one below.</p>
      <p id="error" class="error" hidden></p>

      <section class="project-create">
        <h2>New project</h2>
        <form id="create-form">
          <input id="new-name" type="text" placeholder="Project name" autocomplete="off" required />
          <select id="new-workflow" aria-label="Workflow">
            <option value="scrum">Scrum</option>
            <option value="kanban">Kanban</option>
            <option value="xp">XP</option>
          </select>

          <div class="member-invite">
            <input
              id="member-email"
              type="email"
              placeholder="Teammate email"
              autocomplete="off"
              aria-label="Teammate email"
            />
            <button id="add-member-btn" type="button">Add</button>
          </div>
          <p id="member-error" class="error" hidden></p>
          <ul id="member-list" class="member-list"></ul>

          <button id="create-btn" type="submit">Create</button>
        </form>
        <p id="create-error" class="error" hidden></p>
        <p id="create-note" hidden></p>
      </section>
    </main>
    <script type="module" src="./script.js"></script>
  </body>
</html>
