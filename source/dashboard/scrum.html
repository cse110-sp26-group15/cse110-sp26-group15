<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SitRep — Scrum Dashboard</title>
    <script>
      (function () {
        var t = localStorage.getItem("sitrep_theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
    <!-- theme.css first so its design tokens cascade into every
         page-specific stylesheet below.
         main.css → task-card.css → scrum.css : task-card needs to load
         after main so its newer `.task-card` rules win, and scrum.css
         layers on top for the page-specific tweaks. -->
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/components.css" />
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="../task-card/task-card.css" />
    <link rel="stylesheet" href="../task-form/task-form.css" />
    <link rel="stylesheet" href="scrum.css" />
    <link rel="stylesheet" href="../blocker-card/blocker-card.css" />
    <link rel="stylesheet" href="../agent-card/agent-card.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- ── Sidebar ──────────────────────────────────── -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <!-- Clicking the logo takes the user to their Projects page,
               where they can switch between the projects they belong to. -->
          <a href="../projects/projects.html" class="sidebar-logo">
            <div class="logo-mark">S</div>
            <div class="logo-text">SitRep</div>
          </a>
        </div>

        <nav class="sidebar-nav">
          <a href="scrum.html" class="nav-item active">Dashboard</a>
          <!-- Routes to the dedicated check-in page (source/check-in) so the
               daily stand-up form is reachable from the scrum dashboard. -->
          <a href="../check-in/check-in.html" class="nav-item" data-nav="check-ins">My Check-ins</a>
          <a href="#" class="nav-item" data-nav="team">Team</a>
          <a href="#" class="nav-item" data-nav="weekly-report">Weekly Report</a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-menu" id="user-menu">
            <div class="user-dropdown" id="user-dropdown" hidden>
              <a href="../profile/index.html" class="dropdown-item">
                <svg
                  class="dropdown-icon"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="8" cy="5.5" r="2.5" />
                  <path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" />
                </svg>
                Profile
              </a>
              <a href="../settings/index.html" class="dropdown-item">
                <svg
                  class="dropdown-icon"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="8" cy="8" r="2" />
                  <path
                    d="M8 2v1M8 13v1M2 8h1M13 8h1M3.5 3.5l.7.7M11.8 11.8l.7.7M12.5 3.5l-.7.7M4.2 11.8l-.7.7"
                  />
                </svg>
                Settings
              </a>
              <div class="dropdown-divider"></div>
              <button type="button" class="dropdown-item dropdown-item--danger" id="logout-btn">
                <svg
                  class="dropdown-icon"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M10 11l3-3-3-3M13 8H6M6 3H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3" />
                </svg>
                Log Out
              </button>
            </div>
            <button
              type="button"
              class="user-menu-trigger"
              id="user-menu-trigger"
              aria-haspopup="true"
              aria-expanded="false"
              aria-label="Account menu"
            >
              <div class="avatar" id="user-avatar">U</div>
              <div class="user-info">
                <p class="user-name" id="user-name">User</p>
                <p class="user-role" id="user-email"></p>
              </div>
              <svg
                class="user-menu-chevron"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="4 6 8 10 12 6" />
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <div class="main-content">
        <main class="content-area" id="page-content">
          <div id="dashboard-view" class="page-view">
            <!-- ── Sprint header ─────────────────────────────── -->
            <div class="sprint-header">
              <div class="sprint-header-text">
                <h1 class="sprint-title">Team Dashboard</h1>
                <!-- Sprint meta line — populated from sprintState in scrum.js. -->
                <p class="sprint-meta" id="sprint-meta">Sprint — · loading…</p>
              </div>
              <div class="sprint-header-actions">
                <!-- Toggle the sprint configuration panel below the header. -->
                <button class="btn btn--secondary" id="edit-sprint-btn" type="button">
                  Edit sprint
                </button>
                <button class="btn btn--primary" id="checkin-today-btn" type="button">
                  + Check in today
                </button>
              </div>
            </div>

            <!-- ── Sprint picker (sprint # + date range) ─────── -->
            <!-- Collapsed by default; opened via "Edit sprint". Lets the
                 user override sprint metadata without an API. Selection is
                 persisted to localStorage so it survives reloads. -->
            <section class="sprint-picker hidden" id="sprint-picker">
              <div class="sprint-picker-row">
                <label class="sprint-picker-field">
                  <span>Sprint #</span>
                  <input type="number" id="sprint-number-input" class="input" min="1" step="1" />
                </label>
                <label class="sprint-picker-field">
                  <span>Start date</span>
                  <input type="date" id="sprint-start-input" class="input" />
                </label>
                <label class="sprint-picker-field">
                  <span>End date</span>
                  <input type="date" id="sprint-end-input" class="input" />
                </label>
                <div class="sprint-picker-buttons">
                  <button class="btn btn--primary" id="save-sprint-btn" type="button">Save</button>
                  <button class="btn btn--secondary" id="cancel-sprint-btn" type="button">
                    Cancel
                  </button>
                </div>
              </div>
              <!-- Inline error/help — surfaces invalid date ranges, etc. -->
              <p class="sprint-picker-error" id="sprint-picker-error" hidden></p>
            </section>

            <!-- Open blockers are surfaced once as cards at the top of the
                 page via the blocker rail (../blocker-card/blocker-card-init.js);
                 the standalone blockers list has been removed to avoid showing
                 the same blockers twice. -->

            <!-- ── Sprint progress ───────────────────────────── -->
            <section class="panel sprint-progress-panel">
              <header class="panel-header">
                <h2 class="panel-title" id="sprint-progress-title">Sprint Progress</h2>
              </header>
              <div class="sprint-progress-row">
                <div class="progress-bar" aria-label="Sprint progress">
                  <div class="progress-bar-fill" id="sprint-progress-fill" style="width: 0%"></div>
                </div>
                <div class="progress-meta">
                  <span id="sprint-progress-text">0 / 0 tasks</span>
                  <!-- Current day of the sprint (e.g. "Day 3 of 7"); hidden
                       until a valid date range is set. -->
                  <span class="sprint-day-badge" id="sprint-day-badge" hidden></span>
                  <span class="progress-status" id="sprint-progress-status">on track</span>
                </div>
              </div>
            </section>

            <!-- ── Daily standup / check-ins ─────────────────── -->
            <section class="panel">
              <header class="panel-header">
                <h2 class="panel-title">Daily Standup</h2>
                <a href="#" class="panel-link" id="checkin-history-link">View history</a>
              </header>
              <div class="checkin-grid" id="checkin-grid">
                <p class="muted-small">Loading check-ins…</p>
              </div>
            </section>

            <!-- ── AI Agents ──────────────────────────────────
                 Each card mirrors a team member's at-a-glance view:
                 name, type, owning human, current task + review status,
                 last activity, blocker count. Populated from the
                 `agents` array on the dashboard payload. -->
            <section class="panel">
              <header class="panel-header">
                <h2 class="panel-title">AI Agents</h2>
                <div class="panel-header-actions">
                  <span class="panel-link" id="agent-contributions-meta"></span>
                  <button class="btn btn--primary" id="add-agent-btn" type="button">
                    + Add Agent
                  </button>
                </div>
              </header>
              <div class="agents-grid" id="agents-list">
                <p class="muted-small">Loading agents…</p>
              </div>
            </section>

            <!-- ── Sprint Tasks ──────────────────────────────── -->
            <section class="panel">
              <header class="panel-header">
                <h2 class="panel-title">Sprint Tasks</h2>
                <div class="panel-header-actions">
                  <button class="btn btn--primary" id="add-task-btn" type="button">
                    + Add Task
                  </button>
                </div>
              </header>

              <!-- Two view containers — only one is visible at a time.
                   Task creation is handled by the openTaskModal modal from
                   ../task-form/task-form.js (wired up in scrum.js). -->
              <div id="task-list" class="task-list">
                <p class="task-empty">Loading tasks…</p>
              </div>
              <div id="kanban-board" class="kanban-board hidden">
                <p class="task-empty">Loading tasks…</p>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="scrum.js"></script>
    <script type="module" src="../blocker-card/blocker-card-init.js"></script>
  </body>
</html>
