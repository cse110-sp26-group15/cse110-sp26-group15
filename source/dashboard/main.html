<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SitRep</title>
    <script>
      (function () {
        var t = localStorage.getItem("sitrep_theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="../blocker-card/blocker-card.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <div class="logo-mark">A</div>
            <div class="logo-text">Agile Style App</div>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="#" class="nav-item active"> Dashboard </a>
          <!-- Real link to the dedicated check-in page; main.js lets real
               hrefs navigate and only intercepts in-page (href="#") tabs. -->
          <a href="../check-in/check-in.html" class="nav-item"> My Check-ins </a>
          <a href="#" class="nav-item"> Team </a>
          <a href="#" class="nav-item"> Weekly Report </a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-menu" id="user-menu">
            <div class="user-dropdown" id="user-dropdown" hidden>
              <a href="../profile/index.html" class="dropdown-item">
                <svg
                  class="dropdown-icon"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="8" cy="5.5" r="2.5" />
                  <path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" />
                </svg>
                Profile
              </a>
              <a href="../settings/index.html" class="dropdown-item">
                <svg
                  class="dropdown-icon"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="8" cy="8" r="2" />
                  <path
                    d="M8 2v1M8 13v1M2 8h1M13 8h1M3.5 3.5l.7.7M11.8 11.8l.7.7M12.5 3.5l-.7.7M4.2 11.8l-.7.7"
                  />
                </svg>
                Settings
              </a>
              <div class="dropdown-divider"></div>
              <button type="button" class="dropdown-item dropdown-item--danger" id="logout-btn">
                <svg
                  class="dropdown-icon"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M10 11l3-3-3-3M13 8H6M6 3H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3" />
                </svg>
                Log Out
              </button>
            </div>
            <button
              type="button"
              class="user-menu-trigger"
              id="user-menu-trigger"
              aria-haspopup="true"
              aria-expanded="false"
              aria-label="Account menu"
            >
              <div class="avatar" id="user-avatar">U</div>
              <div class="user-info">
                <p class="user-name" id="user-name">User</p>
                <p class="user-role" id="user-email"></p>
              </div>
              <svg
                class="user-menu-chevron"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="4 6 8 10 12 6" />
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <div class="main-content">
        <main class="content-area" id="page-content">
          <div id="dashboard-view">
            <div class="section-header">
              <h2 class="section-title">Tasks</h2>
              <button class="btn-primary" id="add-task-btn">+ Add Task</button>
            </div>

            <div id="add-task-form" class="task-form hidden">
              <input type="text" id="new-task-title" class="task-input" placeholder="Task title" />
              <select id="new-task-assignee" class="assignee-select">
                <option value="">Unassigned</option>
              </select>
              <button class="btn-primary" id="submit-task-btn">Create</button>
              <button class="btn-secondary" id="cancel-task-btn">Cancel</button>
            </div>

            <div id="task-list" class="task-list" data-card-variant="kanban">
              <p class="task-empty">Loading tasks...</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="main.js"></script>
    <script type="module" src="../task-form/task-form.js"></script>
    <script type="module" src="../blocker-card/blocker-card-init.js"></script>
  </body>
</html>
