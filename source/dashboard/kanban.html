<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SitRep</title>
    <script>
      (function () {
        var t = localStorage.getItem("sitrep_theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/components.css" />
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="../task-card/task-card.css" />
    <link rel="stylesheet" href="../task-form/task-form.css" />
    <link rel="stylesheet" href="../blocker-card/blocker-card.css" />
    <link rel="stylesheet" href="../agent-card/agent-card.css" />
    <link rel="stylesheet" href="kanban.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- ── Sidebar ──────────────────────────────────── -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <!-- Clicking the logo takes the user to their Projects page,
               where they can switch between the projects they belong to. -->
          <a href="../projects/projects.html" class="sidebar-logo">
            <div class="logo-mark">S</div>
            <div class="logo-text">SitRep</div>
          </a>
        </div>
        <nav class="sidebar-nav">
          <a href="#" class="nav-item active">Dashboard</a>
          <!-- Real link to the dedicated check-in page; main.js lets real
               hrefs navigate and only intercepts in-page (href="#") tabs. -->
          <a href="../check-in/check-in.html" class="nav-item">My Check-ins</a>
          <a href="#" class="nav-item">Team</a>
          <a href="#" class="nav-item">Weekly Report</a>
        </nav>
        <div class="sidebar-footer">
          <div class="user-menu" id="user-menu">
            <div class="user-dropdown" id="user-dropdown" hidden>
              <a href="../profile/index.html" class="dropdown-item">
                <svg
                  class="dropdown-icon"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="8" cy="5.5" r="2.5" />
                  <path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" />
                </svg>
                Profile
              </a>
              <a href="../settings/index.html" class="dropdown-item">
                <svg
                  class="dropdown-icon"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="8" cy="8" r="2" />
                  <path
                    d="M8 2v1M8 13v1M2 8h1M13 8h1M3.5 3.5l.7.7M11.8 11.8l.7.7M12.5 3.5l-.7.7M4.2 11.8l-.7.7"
                  />
                </svg>
                Settings
              </a>
              <div class="dropdown-divider"></div>
              <button type="button" class="dropdown-item dropdown-item--danger" id="logout-btn">
                <svg
                  class="dropdown-icon"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M10 11l3-3-3-3M13 8H6M6 3H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3" />
                </svg>
                Log Out
              </button>
            </div>
            <button
              type="button"
              class="user-menu-trigger"
              id="user-menu-trigger"
              aria-haspopup="true"
              aria-expanded="false"
              aria-label="Account menu"
            >
              <div class="avatar" id="user-avatar">U</div>
              <div class="user-info">
                <p class="user-name" id="user-name">User</p>
                <p class="user-role" id="user-email"></p>
              </div>
              <svg
                class="user-menu-chevron"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="4 6 8 10 12 6" />
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <!-- ── Main content ──────────────────────────────── -->
      <div class="main-content">
        <main class="content-area" id="page-content">
          <!-- Dashboard view -->
          <div id="dashboard-view" class="page-view">
            <div class="section-header">
              <button class="btn btn--primary" id="add-task-btn" type="button">+ Add Task</button>
            </div>

            <div id="blockers-banner" class="blockers-banner hidden">
              <span class="blockers-banner__icon">⚠</span>
              <span class="blockers-banner__label">Blockers</span>
              <div class="blockers-banner__list" id="blockers-list"></div>
            </div>

            <!-- ── AI Agents ──────────────────────────────────
                 Same agent rail as scrum/xp dashboards. Populated from
                 the dashboard payload's `agents` array. -->
            <section class="agents-section" id="agents-section">
              <header class="agents-section__header">
                <h2 class="agents-section__title">AI Agents</h2>
                <button class="btn btn--primary" id="add-agent-btn" type="button">
                  + Add Agent
                </button>
              </header>
              <div class="agents-grid" id="agents-list">
                <p class="muted-small">Loading agents…</p>
              </div>
            </section>

            <div class="kanban-board" id="kanban-board">
              <div class="kanban-col" id="col-todo" data-status="todo">
                <div class="kanban-col__header">
                  <span class="kanban-col__title">To Do</span>
                  <span class="kanban-col__count" id="count-todo">0</span>
                </div>
                <div class="kanban-col__cards" id="cards-todo">
                  <p class="kanban-col__empty">No tasks yet</p>
                </div>
              </div>

              <div class="kanban-col" id="col-in-progress" data-status="in-progress">
                <div class="kanban-col__header">
                  <span class="kanban-col__title">In Progress</span>
                  <span class="kanban-col__count" id="count-in-progress">0</span>
                </div>
                <div class="kanban-col__cards" id="cards-in-progress">
                  <p class="kanban-col__empty">No tasks yet</p>
                </div>
              </div>

              <div class="kanban-col" id="col-done" data-status="done">
                <div class="kanban-col__header">
                  <span class="kanban-col__title">Done</span>
                  <span class="kanban-col__count" id="count-done">0</span>
                </div>
                <div class="kanban-col__cards" id="cards-done">
                  <p class="kanban-col__empty">No tasks yet</p>
                </div>
              </div>
            </div>
          </div>
          <!-- Check-ins view -->
          <div id="checkins-view" class="page-view hidden">
            <section class="checkin-section">
              <h2 class="checkin-section__title">My Check-ins</h2>
              <div id="checkin-list" class="checkin-list">
                <p class="task-empty">No check-ins yet.</p>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="main.js"></script>
    <script type="module" src="../blocker-card/blocker-card-init.js"></script>
    <script type="module" src="../task-form/task-form.js"></script>
  </body>
</html>
